<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devansh Marketing</title>
<meta name="theme-color" content="#0F52BA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo loads without blocking the page; system-ui shows until it arrives. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/owner.css">
<link rel="stylesheet" href="css/staff.css">
<link rel="stylesheet" href="css/phone-roles.css">
<style>.lang{display:none!important}.sumlink{display:none!important}</style>
<script>try{localStorage.setItem("dm.lang","en")}catch(e){}</script>
</head>
<body>
<a class="skip" href="#view" data-i18n="a11y.skip">Skip to content</a>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="brand" href="#/"><img src="assets/devansh/devansh-logo-primary-white.svg" alt="Devansh Marketing"></a>
    <a class="chip" id="role-chip" href="#/" data-i18n-attr="title:role.change">
      <span id="role-name" data-i18n="role.landing">Demo</span>
    </a>
    <button class="iconbtn search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search" data-i18n-attr="aria-label:search.label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    </button>
    <form class="search" id="search" role="search" onsubmit="return false">
      <input type="search" id="search-input" autocomplete="off" data-i18n-attr="placeholder:search.placeholder;aria-label:search.label" placeholder="Search dealer, brand, product or invoice">
    </form>
    <div class="lang" role="group" data-i18n-attr="aria-label:lang.label" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="te" data-lang="te" aria-pressed="false" lang="te">తె</button>
    </div>
  </div>
</header>

<main class="view" id="view" tabindex="-1"></main>

<footer class="ftr"><p data-i18n="footer.sample">Sample data · Busy Fox demo</p></footer>

<script type="module">
import { t, getLang, setLang, onLangChange, translateDom } from './js/i18n.js';
import { onRoute } from './js/router.js';
import { initSearch, setSearchAllowed } from './js/ui/search.js';

const view = document.getElementById('view');
const hdr = document.getElementById('hdr');
const toggle = document.getElementById('search-toggle');
const roleName = document.getElementById('role-name');
let current = null;

const ROLE_OF = { landing: 'landing', owner: 'owner', 'owner-report': 'owner', 'owner-activity': 'owner', 'owner-invoice': 'owner', staff: 'staff', dealer: 'dealer', driver: 'driver', whatsapp: 'whatsapp', unknown: 'unknown' };
const el = (tag, attrs = {}, text) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};

// Screens load on demand. A view returns a function that stops its listeners; it runs before the next render.
const VIEWS = {
  owner: async () => (await import('./js/views/owner-home.js')).renderOwnerHome(view),
  'owner-report': async (r) => (await import('./js/views/owner-reports.js')).renderOwnerReports(view, r.params),
  'owner-activity': async () => (await import('./js/views/owner-activity.js')).renderOwnerActivity(view),
  'owner-invoice': async (r) => (await import('./js/views/invoice.js')).renderInvoice(view, r.params.invoiceId),
  staff: async (r) => (await import('./js/views/staff.js')).renderStaff(view, r.params),
  dealer: async (r) => (await import('./js/views/dealer.js')).renderDealer(view, r.params),
  driver: async (r) => (await import('./js/views/driver.js')).renderDriver(view, r.params),
  whatsapp: async () => { location.hash = '#/owner'; },
};
const BLEED = new Set(['owner', 'owner-report', 'owner-activity', 'owner-invoice', 'staff', 'dealer', 'driver']);
let dispose = null;
let token = 0;

function renderView(r) {
  const role = ROLE_OF[r.name];
  const mine = ++token;
  if (dispose) { dispose(); dispose = null; }
  view.replaceChildren();
  view.classList.toggle('bleed', BLEED.has(r.name));
  setSearchAllowed(role === 'owner');
  if (VIEWS[r.name]) {
    VIEWS[r.name](r).then((stop) => { if (mine === token) dispose = stop; else if (stop) stop(); });
  } else if (r.name === 'landing') {
    view.append(el('h1', {}, t('landing.title')), el('p', { class: 'lede' }, t('landing.intro')));
    const list = el('ul', { class: 'roles' });
    for (const [key, href] of [['owner', '#/owner'], ['staff', '#/staff'], ['dealer', '#/dealer/demo'], ['driver', '#/driver/demo']]) {
      const a = el('a', { class: 'role-link', href });
      a.append(el('b', {}, t(`landing.${key}`)), el('span', {}, t(`landing.${key}.desc`)));
      const li = el('li'); li.append(a); list.append(li);
    }
    view.append(list);
  } else if (r.name === 'unknown') {
    view.append(el('h1', {}, t('unknown.title')), el('a', { class: 'btn', href: '#/' }, t('unknown.back')));
  } else {
    const p = el('p', { class: 'stub' }, t('view.soon') + ' ');
    p.append(el('code', {}, r.hash));
    view.append(el('h1', {}, t(`role.${role}`)), p);
  }
  roleName.dataset.i18n = `role.${role}`;
  translateDom(hdr);
  document.title = `${t(`role.${role}`)} · ${t('app.title')}`;
}

function syncLangButtons() {
  document.querySelectorAll('.lang [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === getLang())));
}

document.querySelectorAll('.lang [data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
toggle.addEventListener('click', () => {
  const open = hdr.classList.toggle('search-open');
  toggle.setAttribute('aria-expanded', String(open));
  if (open) document.getElementById('search-input').focus();
});
onLangChange(() => { translateDom(); syncLangButtons(); if (current) renderView(current); });
onRoute((r) => { current = r; renderView(r); window.scrollTo(0, 0); });
initSearch(document.getElementById('search-input'), document.getElementById('search'));
translateDom();
syncLangButtons();
document.documentElement.dataset.ready = '1'; // the shell is wired: tests wait for this
</script>
</body>
</html>
