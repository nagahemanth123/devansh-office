<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devansh Marketing</title>
<meta name="theme-color" content="#0F52BA">
<!-- The whole module graph is fetched in one round trip instead of one per import level (slow 4G). -->
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/router.js">
<link rel="modulepreload" href="js/money.js">
<link rel="modulepreload" href="js/strings/en.js">
<link rel="modulepreload" href="js/strings/en-owner.js">
<link rel="modulepreload" href="js/data/catalog.js">
<link rel="modulepreload" href="js/selectors.js">
<link rel="modulepreload" href="js/seed.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/ui/common.js">
<link rel="modulepreload" href="js/ui/search.js">
<link rel="modulepreload" href="js/ui/time-toggle.js">
<link rel="modulepreload" href="js/ui/sheet.js">
<link rel="modulepreload" href="js/ui/since.js">
<link rel="modulepreload" href="js/views/owner-home.js">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/owner.css">
<link rel="stylesheet" href="css/guide.css">
</head>
<body>
<a class="skip" href="#view" data-i18n="a11y.skip">Skip to content</a>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="brand" href="#/"><img src="assets/devansh/devansh-logo-primary-white.svg" alt="Devansh Marketing"></a>
    <div class="rolemenu">
      <button class="chip" id="role-chip" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="role-menu" data-i18n-attr="title:role.menu">
        <span id="role-name" data-i18n="role.landing">Demo</span>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="rolelist" id="role-menu" hidden></ul>
    </div>
    <button class="iconbtn search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search" data-i18n-attr="aria-label:search.label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    </button>
    <form class="search" id="search" role="search" onsubmit="return false">
      <input type="search" id="search-input" autocomplete="off" data-i18n-attr="placeholder:search.placeholder;aria-label:search.label" placeholder="Search dealer, brand, product or invoice">
    </form>
  </div>
</header>

<div class="stage" id="stage"><div class="phone" id="phone"><main class="view" id="view" tabindex="-1"></main></div></div>

<footer class="ftr"><p><span data-i18n="footer.sample">Sample data · Busy Fox demo</span><a class="ftr-link" id="ftr-previews" href="previews/" hidden data-i18n="landing.previews">Previews</a></p></footer>

<script type="module">
import { t, translateDom } from './js/i18n.js';
import { onRoute } from './js/router.js';
import { initSearch, setSearchAllowed } from './js/ui/search.js';

const view = document.getElementById('view');
const hdr = document.getElementById('hdr');
const toggle = document.getElementById('search-toggle');
const roleName = document.getElementById('role-name');
const stage = document.getElementById('stage');
const chip = document.getElementById('role-chip');
const roleMenu = document.getElementById('role-menu');
const previews = document.getElementById('ftr-previews');
let current = null;

const ROLE_OF = { landing: 'landing', owner: 'owner', 'owner-report': 'owner', 'owner-activity': 'owner', 'owner-invoice': 'owner', staff: 'staff', dealer: 'dealer', driver: 'driver', unknown: 'unknown' };
const el = (tag, attrs = {}, text) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};

// Staff and phone-role styles load with their screens, so the owner home does not wait for them.
const sheets = new Map();
const css = (href) => {
  if (!sheets.has(href)) sheets.set(href, new Promise((done) => { const l = el('link', { rel: 'stylesheet', href }); l.onload = l.onerror = done; document.head.append(l); }));
  return sheets.get(href);
};
const withCss = (href, load) => async (r) => { await css(href); return load(r); };

// Screens load on demand. A view returns a function that stops its listeners; it runs before the next render.
const VIEWS = {
  landing: async () => {
    const G = await import('./js/guide.js');
    G.initGuide(view);
    const { renderLanding } = await import('./js/views/landing.js');
    return renderLanding(view, { total: G.TOTAL, savedStep: G.savedStep, onStart: () => G.startGuide(), onContinue: () => G.resumeGuide(), onReset: () => G.resetAll() });
  },
  owner: async () => (await import('./js/views/owner-home.js')).renderOwnerHome(view),
  'owner-report': async (r) => (await import('./js/views/owner-reports.js')).renderOwnerReports(view, r.params),
  'owner-activity': async () => (await import('./js/views/owner-activity.js')).renderOwnerActivity(view),
  'owner-invoice': async (r) => (await import('./js/views/invoice.js')).renderInvoice(view, r.params.invoiceId),
  staff: withCss('css/staff.css', async (r) => (await import('./js/views/staff.js')).renderStaff(view, r.params)),
  dealer: withCss('css/phone-roles.css', async (r) => (await import('./js/views/dealer.js')).renderDealer(view, r.params)),
  driver: withCss('css/phone-roles.css', async (r) => (await import('./js/views/driver.js')).renderDriver(view, r.params)),
};
// Owner, dealer and driver are phone screens: on a laptop they sit in a phone-sized frame.
const FRAMED = new Set(['owner', 'dealer', 'driver']);
const BLEED = new Set(['owner', 'owner-report', 'owner-activity', 'owner-invoice', 'staff', 'dealer', 'driver']);
let dispose = null;
let token = 0;

function renderView(r) {
  const role = ROLE_OF[r.name];
  const mine = ++token;
  if (dispose) { dispose(); dispose = null; }
  view.replaceChildren();
  view.classList.toggle('bleed', BLEED.has(r.name));
  stage.classList.toggle('framed', FRAMED.has(role));
  previews.hidden = r.name !== 'landing';
  setSearchAllowed(role === 'owner');
  hdr.classList.toggle('no-search', role !== 'owner'); // the search box only answers on owner screens, so it is hidden elsewhere
  if (role !== 'owner') hdr.classList.remove('search-open');
  if (VIEWS[r.name]) {
    VIEWS[r.name](r).then((stop) => { if (mine === token) dispose = stop; else if (stop) stop(); setTimeout(loadFonts, 200); });
  } else if (r.name === 'unknown') {
    view.append(el('h1', {}, t('unknown.title')), el('a', { class: 'btn', href: '#/' }, t('unknown.back')));
  } else {
    const p = el('p', { class: 'stub' }, t('view.soon') + ' ');
    p.append(el('code', {}, r.hash));
    view.append(el('h1', {}, t(`role.${role}`)), p);
  }
  roleName.dataset.i18n = `role.${role}`;
  drawMenu(role);
  setMenu(false);
  translateDom(hdr);
  document.title = `${t(`role.${role}`)} · ${t('app.title')}`;
}

// The role chip opens a small menu: the four roles and the start page.
const SEATS = [['owner', '#/owner'], ['staff', '#/staff'], ['dealer', '#/dealer/D-MYD-01'], ['driver', '#/driver/demo']];
function drawMenu(role) {
  const items = [['landing', '#/', t('role.home')], ...SEATS.map(([k, h]) => [k, h, t(`role.${k}`)])];
  roleMenu.replaceChildren(...items.map(([k, h, label]) => {
    const li = el('li'); const a = el('a', { href: h, 'data-seat': k }, label);
    if (k === role) a.setAttribute('aria-current', 'page');
    li.append(a); return li;
  }));
}
function setMenu(open) { roleMenu.hidden = !open; chip.setAttribute('aria-expanded', String(open)); }
chip.addEventListener('click', () => setMenu(roleMenu.hidden));
document.addEventListener('click', (e) => { if (!roleMenu.hidden && !e.target.closest('.rolemenu')) setMenu(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !roleMenu.hidden) { setMenu(false); chip.focus(); } });

toggle.addEventListener('click', () => {
  const open = hdr.classList.toggle('search-open');
  toggle.setAttribute('aria-expanded', String(open));
  if (open) document.getElementById('search-input').focus();
});
onRoute((r) => { current = r; renderView(r); window.scrollTo(0, 0); });
initSearch(document.getElementById('search-input'), document.getElementById('search'));
translateDom();
try { if (localStorage.getItem('dm.guide')) import('./js/guide.js').then((G) => G.initGuide(view)); } catch { /* storage blocked: no saved guide */ }
// Archivo is fetched after the first screen so it never competes with the screen's own files; system-ui shows until it arrives.
const fontCss = 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap';
let fontsAsked = false;
function loadFonts() {
  if (fontsAsked) return; fontsAsked = true;
  document.head.append(el('link', { rel: 'preconnect', href: 'https://fonts.gstatic.com', crossorigin: '' }), el('link', { rel: 'stylesheet', href: fontCss }));
}
document.documentElement.dataset.ready = '1'; // the shell is wired: tests wait for this
</script>
</body>
</html>
