<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devansh Godown Board</title>
<meta name="theme-color" content="#0F52BA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Anek Telugu";src:url("../assets/fonts/AnekTelugu-Variable.woff2") format("woff2");font-weight:100 800;font-stretch:75% 125%;font-display:swap}
:root{
  --sapphire:#0F52BA; --sapphire-press:#0B4296; --sapphire-ink:#0A3A84;
  --ink:#0E1A2B; --ink-2:#38424F; --ink-3:#5A6372;
  --paper:#F3F2EE; --card:#FFFFFF; --line:#E2E0D9; --well:#E7E5DE; --page:#DEDCD5;
  --g:#17804A; --b:#2563EB; --a:#AE5A00; --r:#C22A2A; --n:#59636F;
  --radius:14px;
  --font:"Archivo","Anek Telugu",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;font-stretch:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:3px solid #F2B705;outline-offset:2px;border-radius:8px}
.app{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 0 1px #D2D0C8}
.num{font-stretch:112%;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
html[lang=te] .tel{line-height:1.55}

/* ---------- top sapphire block ---------- */
.top{background:var(--sapphire);color:#fff;padding:8px 16px 90px}
.bar{display:flex;align-items:center;gap:6px;height:56px}
.bar img{height:34px;width:auto;display:block;margin-right:auto}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.iconbtn:active{background:var(--sapphire-press)}
.lang{display:flex;height:48px;border:2px solid #fff;border-radius:10px;overflow:hidden;margin-left:2px}
.lang button{min-width:46px;height:100%;text-align:center;font-weight:700;font-size:15px;color:#fff;padding:0 10px;display:grid;place-items:center}
.lang button[aria-pressed=true]{background:#fff;color:var(--sapphire)}
.lang button+button{border-left:2px solid #fff}
.lang .te{font-family:"Anek Telugu";font-size:17px;line-height:1}
.hello{margin:8px 0 0;font-size:16px;color:#DCE6F7;display:flex;gap:8px;flex-wrap:wrap}
.hello b{color:#fff;font-weight:700}
.q{margin:12px 0 0;font-size:20px;font-weight:700;color:#fff}
.answer{font-size:46px;line-height:1.02;margin:6px 0 8px}
.answer small{font-size:22px;font-weight:700;font-stretch:100%;letter-spacing:0;margin-left:4px}
.sub{font-size:16px;color:#E3EBF8;margin:0;max-width:34ch}
.sub b{color:#fff}

/* ---------- cycle tray ---------- */
.tray{margin:-74px 12px 0;background:var(--card);border-radius:var(--radius);padding:18px 16px 0;overflow:hidden;position:relative}
.tray h3{margin:0 0 12px;font-size:17px;font-weight:700}
.stack{display:flex;height:60px;gap:3px;border-radius:8px;overflow:hidden}
.stack > *{display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;white-space:nowrap;min-width:0;overflow:hidden}
.under{position:relative;height:30px}
.under span{position:absolute;top:0;transform:translateX(-50%);font-size:15px;font-weight:700;padding-top:9px;white-space:nowrap}
.under span::before{content:"";position:absolute;left:50%;top:0;width:2px;height:7px;background:var(--b);transform:translateX(-1px)}
.parts{margin:4px -16px 0;border-top:1px solid var(--line)}
.part{display:grid;grid-template-columns:8px 1fr auto 74px 16px;gap:10px;align-items:center;width:100%;min-height:50px;padding:6px 16px;border-bottom:1px solid var(--line)}
.part:active{background:#F6F5F1}
.part .sw{width:8px;align-self:stretch;border-radius:3px}
.part .lbl{font-size:15px;font-weight:600;color:var(--ink)}
.part .amt{text-align:right;font-size:18px}
.part .pc{font-size:15px;font-weight:600;color:var(--ink-3)}
.better{display:flex;gap:10px;align-items:center;background:var(--g);color:#fff;margin:0 -16px;padding:12px 16px;font-size:15px;font-weight:600}
.better .num{font-size:18px;white-space:nowrap}

/* ---------- sections ---------- */
main{padding:0 12px 8px}
section{margin-top:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 12px}
.sh h2{margin:0;font-size:23px;font-weight:800;font-stretch:108%;letter-spacing:-.01em}
.sh .side{font-size:15px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.card{background:var(--card);border-radius:var(--radius)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border-radius:var(--radius);padding:13px 14px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tile:active{background:#F8F7F3}
.tile .tl{font-size:15px;font-weight:600;color:var(--ink-2);padding-right:18px;line-height:1.3;min-height:39px}
html[lang=te] .tile .tl{min-height:46px;line-height:1.5}
.tile .chev{position:absolute;right:12px;top:15px;color:var(--ink-3)}
.tile .tv{font-size:clamp(24px,7.2vw,31px);padding-top:2px;line-height:1.05;white-space:nowrap;font-stretch:106%}
.tile .tv small{font-size:16px;font-weight:700;font-stretch:100%;color:var(--ink-2);letter-spacing:0;margin-left:3px}
.tile .tc{font-size:15px;color:var(--ink-3);padding:5px 0 13px;line-height:1.3}
.tile .tc.up{color:var(--g);font-weight:700}
.tile .tc.flag{margin:auto -14px 0;padding:9px 14px 11px;color:#fff;font-weight:600}

/* status chip */
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:6px;color:#fff;font-size:14px;font-weight:700;white-space:nowrap;line-height:1}
html[lang=te] .chip{font-size:15px;height:30px}

/* attention */
.att{display:grid;grid-template-columns:6px 1fr;width:100%;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .stripe{align-self:stretch}
.att .body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px}
.att .top1{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px}
.att .txt{font-size:15px;color:var(--ink);line-height:1.4}
.att .money{font-size:20px}
.att:active{background:#F8F7F3}

/* brand cards */
.bcard{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative}
.band{height:8px}
.logo{height:50px;display:flex;align-items:center}
.logo img{height:38px;max-width:138px;width:auto;object-fit:contain;object-position:left center;display:block}
.logo.sq img{height:50px}
.logo.plate{padding:0 10px;border-radius:6px}
.logo.plate img{height:34px}

/* inbound */
.key{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 16px 8px;font-size:13px;color:var(--ink-3);font-weight:600;line-height:1.25}
.inb{padding:12px 16px 14px}
.inb .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inb .val{font-size:20px}
.inb .meta{font-size:15px;color:var(--ink-3);margin:6px 0 10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:14px;background:var(--well);border-radius:3px}
.inb .now{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.list{display:grid;gap:10px}

/* outbound */
.plate-no{display:inline-block;border:2px solid var(--ink);border-radius:5px;padding:3px 8px;font-weight:800;font-stretch:96%;font-size:16px;letter-spacing:.04em;background:#fff;line-height:1.2}
.outb{padding:14px 16px}
.outb .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.outb .who{font-size:15px;color:var(--ink-2);margin:8px 0 10px}
.drops{display:flex;gap:4px}
.drops i{flex:1;height:14px;border-radius:3px;background:var(--well)}
.outb .row3{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:16px}
.outb .row3 b{font-weight:800}

/* district */
.dist{padding:16px 12px 12px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 4px 6px}
.totals div{border-top:6px solid;padding-top:8px}
.totals span{display:block;font-size:15px;font-weight:600;color:var(--ink-2)}
.totals b{font-size:24px}
.note{font-size:15px;color:var(--ink-3);margin:8px 4px 0}
svg text{font-family:var(--font)}

/* top brands grid */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg-in{padding:12px 14px 14px}
.bg-in .amt{font-size:22px;margin:12px 0 2px}
.bg-in .share{height:8px;background:var(--well);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bg-in .share i{display:block;height:100%}
.more{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:52px;margin-top:10px;border:2px solid var(--ink);border-radius:12px;font-weight:700;font-size:16px;background:transparent}
.more:active{background:#E9E7E0}

/* money */
.money-card{padding:16px}
.money-card h3{margin:0 0 12px;font-size:17px;font-weight:700}
.bands{margin-top:10px}
.bands div{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700}
.bands div:last-child{border-bottom:0;min-height:36px;padding-top:6px}
.dealer{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;align-items:center}
.dealer:last-child{border-bottom:0;padding-bottom:2px}
.dealer .dn{font-size:16px;font-weight:700}
.dealer .dt{font-size:15px;color:var(--ink-3)}
.dealer .da{font-size:19px;text-align:right}
.dealer .dc{text-align:right}
.pay{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:0 14px 0 0;min-height:72px}
.pay .vb{width:8px;align-self:stretch}
.pay .pa{font-size:20px;text-align:right}
.pay .pd{margin-top:4px;text-align:right}

footer{padding:26px 16px 40px;text-align:center;font-size:15px;color:var(--ink-3);border-top:1px solid #D9D7CF;margin-top:34px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,36,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;transition:opacity .2s}
.scrim[hidden]{display:none}
.scrim.open{opacity:1}
.sheet{width:100%;max-width:430px;max-height:88vh;background:var(--paper);border-radius:18px 18px 0 0;overflow:auto;transform:translateY(24px);transition:transform .22s ease-out}
.scrim.open .sheet{transform:none}
.sheet-head{color:#fff;padding:14px 12px 18px 18px;position:sticky;top:0}
.sheet-head .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h2{margin:8px 0 0;font-size:19px;font-weight:700;line-height:1.3}
.sheet-head .big{font-size:40px;margin-top:6px;line-height:1}
.sheet-head .closer{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.sheet-body{padding:14px 12px 28px}
.inv{background:#fff;border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin-bottom:10px}
.inv .dn{font-size:16px;font-weight:700;line-height:1.3}
.inv .no{font-size:15px;color:var(--ink-3)}
.inv .amt{font-size:20px;text-align:right}
.inv .nt{grid-column:1/-1;font-size:15px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.sheet-foot{font-size:15px;color:var(--ink-3);padding:4px 4px 0}
.ph{background:#fff;border-radius:12px;padding:18px 16px;font-size:16px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{transition:none}}
@media (min-width:431px){body{padding:0}}
img[src*="sparsh-pearl"]{filter:brightness(.62) saturate(1.15)}
</style>
</head>

const lbl = o => (lang==='te' && o.te) ? o.te : o.label;
const trim = s => s.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
function money(v){
  if(v>=1e7) return '₹'+trim((v/1e7).toFixed(2))+'\u00A0Cr';
  if(v>=1e5) return '₹'+(v/1e5).toFixed(1)+'\u00A0L';
  return '₹'+v.toLocaleString('en-IN');
}
const full = v => '₹'+v.toLocaleString('en-IN');
const chip = (status, word) => `<span class="chip" style="background:${ST[status]}">${word}</span>`;
const chev = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const bname = k => (D.brands.find(b=>b.key===k)||{name:k}).name;
function logo(k){
  const b = BRAND[k]||{c:'#333'};
  return b.dark
    ? `<span class="logo plate" style="background:${b.c}"><img src="../assets/brands/${k}.png" alt="${bname(k)}"></span>`
    : `<span class="logo${k==='sparsh-pearl'?' sq':''}"><img src="../assets/brands/${k}.png" alt="${bname(k)}"></span>`;
}

function dayNo(s){ return parseInt(s.replace(/^\D+/,''),10); }

function chart(){
  const w = D.districtWeekly, W=340, H=220, l=44, r=6, t=26, b=40;
  const pw = W-l-r, ph = H-t-b, max = 2000000, n = w.weeks.length, gw = pw/n, bw = 21;
  const y = v => t + ph - v/max*ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly sales, Kadapa and Anantapur">
  <defs>
    <pattern id="hk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="3.2" height="6" fill="#0F52BA"/></pattern>
    <pattern id="ha" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="3.2" height="6" fill="#5B8BD8"/></pattern>
  </defs>`;
  [0,500000,1000000,1500000,2000000].forEach(v=>{
    s += `<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'#E6E4DD':'#0E1A2B'}" stroke-width="${v?1:1.5}"/>`;
    s += `<text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#5A6372">${v?'₹'+v/1e5+' L':'0'}</text>`;
  });
  w.weeks.forEach((wk,i)=>{
    const cx = l + gw*i + gw/2, part = i===n-1, last = i===n-2;
    const k = w.Kadapa[i], a = w.Anantapur[i];
    const x1 = cx - bw - 1.5, x2 = cx + 1.5;
    s += `<rect x="${x1}" y="${y(k)}" width="${bw}" height="${y(0)-y(k)}" fill="${part?'url(#hk)':'#0F52BA'}" ${part?'stroke="#0F52BA" stroke-width="1.5"':''}/>`;
    s += `<rect x="${x2}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" fill="${part?'url(#ha)':'#5B8BD8'}" ${part?'stroke="#5B8BD8" stroke-width="1.5"':''}/>`;
    if(last || part){
      s += `<text x="${x1+bw/2}" y="${y(k)-6}" text-anchor="middle" font-size="12" font-weight="800" fill="#0E1A2B">${trim((k/1e5).toFixed(1))}</text>`;
      s += `<text x="${x2+bw/2}" y="${y(a)-6}" text-anchor="middle" font-size="12" font-weight="800" fill="#0E1A2B">${trim((a/1e5).toFixed(1))}</text>`;
    }
    s += `<text x="${cx}" y="${H-b+18}" text-anchor="middle" font-size="13" font-weight="${part?700:500}" fill="${part?'#0E1A2B':'#5A6372'}">${wk}</text>`;
    if(part) s += `<text x="${cx}" y="${H-b+34}" text-anchor="middle" font-size="12" font-weight="700" fill="#0E1A2B">${lang==='te'?'ఇప్పటివరకు':'so far'}</text>`;
  });
  return s + `</svg>`;
}

function openSheet(key, from){
  opener = from;
  const p = D.cycle.parts.find(x=>x.key===key);
  const sheet = document.getElementById('sheet');
  let body;
  if(key==='unpaid'){
    const rows = D.drill.unpaid;
    const sum = rows.reduce((s,r)=>s+r.amount,0);
    body = rows.map(r=>`
      <div class="inv">
        <div><div class="dn">${r.dealer}</div><div class="no">${r.invoice}</div></div>
        <div style="text-align:right"><div class="amt num">${full(r.amount)}</div></div>
        <div>${chip(r.status, L(T.inv[r.status]))}</div>
        <div class="num" style="text-align:right;font-size:16px;align-self:center">${L(T.days(r.days))}</div>
        ${r.note?`<div class="nt">${r.note}</div>`:''}
      </div>`).join('') + `<p class="sheet-foot tel">${L(T.drillFoot(full(sum), money(p.amount)))}</p>`;
  } else {
    body = `<div class="ph tel">${L(T.ph[key])}</div>`;
  }
  sheet.innerHTML = `
    <div class="sheet-head" style="background:${ST[p.status]}">
      <div class="r1"><h2 id="sheetTitle" class="tel">${lbl(p)}</h2>
        <button class="closer" id="closeSheet" aria-label="${L(T.close)}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </div>
      <div class="big num">${money(p.amount)}</div>
    </div>
    <div class="sheet-body">${body}</div>`;
  const scrim = document.getElementById('scrim');
  scrim.hidden = false;
  requestAnimationFrame(()=>scrim.classList.add('open'));
  document.body.style.overflow='hidden';
  document.getElementById('closeSheet').focus();
}
function closeSheet(){
  const scrim = document.getElementById('scrim');
  if(scrim.hidden) return;
  scrim.classList.remove('open');
  document.body.style.overflow='';
  setTimeout(()=>{scrim.hidden = true;}, 200);
  if(opener && document.body.contains(opener)) opener.focus();
}

document.addEventListener('click', e=>{
  const lg = e.target.closest('[data-lang]');
  if(lg){ lang = lg.dataset.lang; render(); document.querySelector(`[data-lang="${lang}"]`).focus(); return; }
  const pt = e.target.closest('[data-part]');
  if(pt){ openSheet(pt.dataset.part, pt); return; }
  if(e.target.closest('#moreBrands')){ allBrands = !allBrands; render(); document.getElementById('moreBrands').focus(); return; }
  if(e.target.closest('#closeSheet') || e.target.id==='scrim'){ closeSheet(); }
});
